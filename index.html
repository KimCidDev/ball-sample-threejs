<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mundo Squishy</title>
    <meta name="description" content="Brincadeira em 3D com Three.js: aperte, arraste e arremesse uma bola squishie no Brasil ou no Canadá." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --pink: #ff4fa3;
        --pink-dark: #c2186f;
        --blue: #4f8cff;
        --blue-dark: #1f4fb8;
        --yellow: #ffd23f;
        --green: #1fae5b;
        --ink: #1b1030;
        --font: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cdeeff; font-family: var(--font); }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      body.playing { cursor: none; }
      canvas { display: block; touch-action: none; }

      #girl-cursor {
        position: fixed; left: 0; top: 0; z-index: 10;
        pointer-events: none; will-change: transform;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
        display: none;
      }
      body.playing #girl-cursor { display: block; }

      /* ---------- Telas do menu ---------- */
      .screen {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: clamp(12px, 3vh, 28px);
        padding: 16px; box-sizing: border-box; overflow-y: auto;
        background: radial-gradient(ellipse at 50% 50%, rgba(27, 16, 48, 0) 30%, rgba(27, 16, 48, 0.35) 100%);
        opacity: 0; pointer-events: none; transform: scale(1.04);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .screen.active { opacity: 1; pointer-events: auto; transform: none; }
      .screen.dim { background: rgba(27, 16, 48, 0.45); backdrop-filter: blur(3px); }
      /* tela inicial: título em cima, botões embaixo, bola livre no meio */
      #screen-title { justify-content: space-between; padding: clamp(14px, 5vh, 48px) 16px clamp(18px, 6vh, 56px); }

      /* ---------- Logo ---------- */
      .logo { margin: 0; text-align: center; line-height: 0.95; animation: float 3.2s ease-in-out infinite; }
      .logo .line {
        display: block; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; color: #fff;
        -webkit-text-stroke: 0.06em var(--ink); paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink), 0 0.16em 0.25em rgba(0, 0, 0, 0.3);
      }
      .logo .l1 { font-size: clamp(30px, min(8vw, 9vh), 84px); color: var(--yellow); }
      .logo .l2 { font-size: clamp(38px, min(11vw, 12vh), 120px); }
      .logo .l2 span { display: inline-block; animation: squish 1.8s ease-in-out infinite; }
      .logo .l2 span:nth-child(odd) { color: var(--pink); }
      .logo .l2 span:nth-child(even) { color: #7fb0ff; }
      .logo .o-ball {
        display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0 8%, #ffe680 20%, var(--yellow) 55%, #d9a400);
        box-shadow: inset 0 -0.05em 0 rgba(0, 0, 0, 0.25), 0 0 0 0.06em var(--ink);
        vertical-align: 0.02em; margin-left: 0.03em;
        animation: ball-squish 1.4s ease-in-out infinite;
      }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
      @keyframes squish { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.08, 0.9) translateY(4%); } }
      @keyframes ball-squish {
        0%, 100% { transform: scale(1, 1); }
        40% { transform: scale(1.25, 0.78) translateY(10%); }
        60% { transform: scale(0.9, 1.1); }
      }
      .logo .l2 span:nth-child(2) { animation-delay: 0.1s; } .logo .l2 span:nth-child(3) { animation-delay: 0.2s; }
      .logo .l2 span:nth-child(4) { animation-delay: 0.3s; } .logo .l2 span:nth-child(5) { animation-delay: 0.4s; }
      .logo .l2 span:nth-child(6) { animation-delay: 0.5s; } .logo .l2 span:nth-child(7) { animation-delay: 0.6s; }

      /* ---------- Botões ---------- */
      .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(460px, 100%); }
      .btn {
        font: 700 clamp(18px, 4.5vw, 24px) var(--font);
        color: #fff; padding: 12px 26px; border-radius: 999px; cursor: pointer;
        border: 4px solid var(--ink);
        background: linear-gradient(180deg, #ff7cbb, var(--pink) 60%, var(--pink-dark));
        box-shadow: 0 6px 0 var(--ink), 0 10px 20px rgba(0, 0, 0, 0.3);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .menu .btn[data-action='play'] { grid-column: 1 / -1; justify-self: center; width: min(300px, 100%); font-size: clamp(22px, 5.5vw, 30px); }
      .menu .btn { padding-left: 12px; padding-right: 12px; }
      .btn.secondary { background: linear-gradient(180deg, #8db6ff, var(--blue) 60%, var(--blue-dark)); }
      .btn.green { background: linear-gradient(180deg, #6be09a, var(--green) 60%, #12733b); }
      .btn.ghost { background: rgba(255, 255, 255, 0.15); box-shadow: 0 4px 0 var(--ink); font-size: 18px; padding: 10px 20px; }
      .btn:hover { transform: translateY(-2px) scale(1.03); }
      .btn:active { transform: translateY(5px) scale(0.97, 0.94); box-shadow: 0 1px 0 var(--ink), 0 4px 8px rgba(0, 0, 0, 0.3); }
      .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

      /* ---------- Escolhas (personagem / cenário) ---------- */
      .title {
        margin: 0; font-weight: 700; font-size: clamp(28px, 6.5vw, 50px); color: var(--yellow); text-align: center;
        -webkit-text-stroke: 0.07em var(--ink); paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink);
      }
      .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: min(880px, 100%); }
      .cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(560px, 100%); }
      @media (max-width: 720px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(420px, 100%); gap: 12px; } }
      .card {
        position: relative; aspect-ratio: 4 / 5; padding: 10px 10px 0; box-sizing: border-box;
        border: 5px solid var(--ink); border-radius: 26px; cursor: pointer;
        background: radial-gradient(circle at 50% 30%, #fff, var(--tint-light, #ffd1e6) 55%, var(--tint, var(--pink)) 100%);
        box-shadow: 0 7px 0 var(--ink), 0 12px 26px rgba(0, 0, 0, 0.35);
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden;
        font: inherit; color: inherit; transition: transform 0.15s ease;
      }
      .card:hover { transform: translateY(-3px) rotate(-1deg); }
      .card.selected { outline: 5px solid var(--yellow); outline-offset: 4px; }
      .card img { position: absolute; top: 5%; left: 6%; width: 88%; height: 73%; object-fit: contain; object-position: bottom; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.2)); }
      .card-name {
        position: relative; margin-bottom: 5%; text-align: center;
        font-weight: 700; font-size: clamp(24px, 5vw, 36px); color: #fff;
        -webkit-text-stroke: 0.08em var(--ink); paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink);
      }
      .card-sub { position: relative; margin: -6% 0 9%; font-size: clamp(13px, 2.6vw, 16px); font-weight: 500; color: var(--ink); }
      .badge {
        position: absolute; top: 10px; right: 10px; padding: 3px 9px; border-radius: 999px;
        background: var(--yellow); border: 3px solid var(--ink); font-size: 12px; font-weight: 700; color: var(--ink);
      }
      .card.scene { aspect-ratio: 5 / 4; }
      .card.scene .art { position: absolute; inset: 0; }
      .art.brasil { background: linear-gradient(180deg, #2d8fe0 0, #9fdcff 48%, #17a6c4 48%, #17a6c4 60%, #f0d39c 60%); }
      .art.canada { background: linear-gradient(180deg, #5b8fd0 0, #e4eef8 55%, #f7fbff 55%); }
      .art .flag { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); width: 46%; aspect-ratio: 10 / 7; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }

      .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      .row .btn { min-width: 140px; }

      /* ---------- HUD do jogo ---------- */
      .hud { position: fixed; top: 12px; z-index: 15; display: none; gap: 10px; align-items: center; }
      body.playing .hud { display: flex; }
      #hud-left { left: 12px; }
      #hud-right { right: 12px; }
      .hud .btn { font-size: 16px; padding: 7px 14px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
      .hud .tag {
        font-weight: 700; color: #fff; font-size: 20px;
        -webkit-text-stroke: 0.08em var(--ink); paint-order: stroke fill;
      }
      .hint {
        position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 15;
        color: #fff; font-size: 15px; font-weight: 500; text-align: center; pointer-events: none;
        display: none; padding: 7px 16px; border-radius: 999px; width: max-content; max-width: calc(100% - 32px);
        background: rgba(27, 16, 48, 0.62); box-sizing: border-box;
      }
      body.playing .hint { display: block; }
      @media (max-width: 520px) { .hud .long { display: none; } .hud .tag { font-size: 17px; } }

      @media (prefers-reduced-motion: reduce) {
        .logo, .logo span, .o-ball { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Tela inicial -->
    <section id="screen-title" class="screen active" aria-label="Menu inicial">
      <h1 class="logo" aria-label="Mundo Squishy">
        <span class="line l1" aria-hidden="true">Mund<span class="o-ball"></span></span>
        <span class="line l2" aria-hidden="true"><span>S</span><span>q</span><span>u</span><span>i</span><span>s</span><span>h</span><span>y</span></span>
      </h1>
      <nav class="menu">
        <button class="btn" data-action="play">Jogar</button>
        <button class="btn secondary" data-action="choose">Personagens</button>
        <button class="btn green" data-action="scenes">Cenários</button>
      </nav>
    </section>

    <!-- Escolha de personagem -->
    <section id="screen-select" class="screen dim" aria-label="Escolha de personagem">
      <h2 class="title">Quem vai brincar?</h2>
      <div class="cards" id="character-cards"></div>
      <div class="row">
        <button class="btn ghost" data-action="back">Voltar</button>
        <button class="btn" data-action="start">Jogar</button>
      </div>
    </section>

    <!-- Escolha de cenário -->
    <section id="screen-scenes" class="screen dim" aria-label="Escolha de cenário">
      <h2 class="title">Onde vamos brincar?</h2>
      <div class="cards two" id="scene-cards">
        <button class="card scene" data-scene="brasil" aria-pressed="false">
          <span class="art brasil">
            <svg class="flag" viewBox="0 0 100 70" aria-hidden="true">
              <rect width="100" height="70" fill="#1fae5b" />
              <polygon points="50,7 93,35 50,63 7,35" fill="#ffd23f" />
              <circle cx="50" cy="35" r="15" fill="#2a4fb8" />
              <path d="M36 32 Q50 27 64 37" stroke="#fff" stroke-width="3" fill="none" />
            </svg>
          </span>
          <span class="card-name">Brasil</span>
          <span class="card-sub">Praia ensolarada</span>
        </button>
        <button class="card scene" data-scene="canada" aria-pressed="false">
          <span class="art canada">
            <svg class="flag" viewBox="0 0 100 70" aria-hidden="true">
              <rect width="100" height="70" fill="#fff" />
              <rect width="25" height="70" fill="#d62828" />
              <rect x="75" width="25" height="70" fill="#d62828" />
              <path fill="#d62828" d="M50 12 L54 22 L60 19 L58 33 L66 26 L68 31 L75 30 L71 38 L74 41 L60 49 L61 55 L52 54 L52 63 L48 63 L48 54 L39 55 L40 49 L26 41 L29 38 L25 30 L32 31 L34 26 L42 33 L40 19 L46 22 Z" />
            </svg>
          </span>
          <span class="card-name">Canadá</span>
          <span class="card-sub">Inverno com neve</span>
        </button>
      </div>
      <div class="row">
        <button class="btn ghost" data-action="back">Voltar</button>
        <button class="btn" data-action="start">Jogar</button>
      </div>
    </section>

    <!-- HUD durante o jogo -->
    <div class="hud" id="hud-left">
      <button class="btn secondary" data-action="menu">Menu</button>
      <span class="tag" id="hud-name">Mamá</span>
    </div>
    <div class="hud" id="hud-right">
      <button class="btn green" data-action="swap-scene" id="hud-scene"><span class="long">Ir para o </span>Canadá</button>
      <button class="btn ghost" data-action="sound" id="hud-sound" aria-label="Desligar som">🔊</button>
    </div>
    <div class="hint" id="hint"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
