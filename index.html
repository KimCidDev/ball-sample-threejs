<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mamá's Squishy World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --pink: #ff4fa3;
        --pink-dark: #c2186f;
        --blue: #4f8cff;
        --blue-dark: #1f4fb8;
        --yellow: #ffd23f;
        --ink: #1b1030;
        --font: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; font-family: var(--font); }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      body.playing { cursor: none; }
      canvas { display: block; touch-action: none; }

      #girl-cursor {
        position: fixed; left: 0; top: 0; z-index: 10;
        pointer-events: none; will-change: transform;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
        display: none;
      }
      body.playing #girl-cursor { display: block; }

      /* ---------- Telas do menu ---------- */
      .screen {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: clamp(16px, 4vh, 36px);
        padding: 16px; box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 35%, rgba(255, 79, 163, 0.18), rgba(14, 17, 22, 0.55) 60%, rgba(14, 17, 22, 0.85));
        backdrop-filter: blur(2px);
        opacity: 0; pointer-events: none; transform: scale(1.04);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .screen.active { opacity: 1; pointer-events: auto; transform: none; }

      /* ---------- Logo ---------- */
      .logo { text-align: center; line-height: 0.92; animation: float 3.2s ease-in-out infinite; }
      .logo .line {
        display: block; font-weight: 700; letter-spacing: 0.01em;
        color: #fff;
        -webkit-text-stroke: 0.06em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink), 0 0.16em 0.25em rgba(0, 0, 0, 0.45);
      }
      .logo .l1 { font-size: clamp(40px, 10vw, 104px); white-space: nowrap; }
      .logo .l1 span { display: inline-block; animation: squish 1.8s ease-in-out infinite; }
      .logo .l1 span:nth-child(odd) { color: var(--pink); }
      .logo .l1 span:nth-child(even) { color: var(--yellow); }
      .logo .l2 { font-size: clamp(40px, 12.5vw, 140px); color: #7fb0ff; white-space: nowrap; }
      .logo .l2 .o-ball {
        display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0 8%, #9cc2ff 20%, var(--blue) 55%, var(--blue-dark));
        box-shadow: inset 0 -0.05em 0 rgba(0, 0, 0, 0.25), 0 0 0 0.05em var(--ink);
        vertical-align: 0.02em; margin: 0 0.02em;
        animation: ball-squish 1.4s ease-in-out infinite;
      }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
      @keyframes squish { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.08, 0.9) translateY(4%); } }
      @keyframes ball-squish {
        0%, 100% { transform: scale(1, 1); }
        40% { transform: scale(1.25, 0.78) translateY(10%); }
        60% { transform: scale(0.9, 1.1); }
      }
      .logo .l1 span:nth-child(2) { animation-delay: 0.1s; } .logo .l1 span:nth-child(3) { animation-delay: 0.2s; }
      .logo .l1 span:nth-child(4) { animation-delay: 0.3s; } .logo .l1 span:nth-child(5) { animation-delay: 0.4s; }
      .logo .l1 span:nth-child(6) { animation-delay: 0.5s; } .logo .l1 span:nth-child(7) { animation-delay: 0.6s; }
      .logo .l1 span:nth-child(8) { animation-delay: 0.7s; } .logo .l1 span:nth-child(9) { animation-delay: 0.8s; }
      .logo .l1 span:nth-child(10) { animation-delay: 0.9s; } .logo .l1 span:nth-child(11) { animation-delay: 1s; }
      .logo .l1 span:nth-child(12) { animation-delay: 1.1s; } .logo .l1 span:nth-child(13) { animation-delay: 1.2s; }

      /* ---------- Botões ---------- */
      .menu { display: flex; flex-direction: column; gap: 14px; width: min(340px, 100%); }
      .btn {
        font: 700 clamp(20px, 5vw, 26px) var(--font);
        color: #fff; padding: 14px 24px; border-radius: 999px; cursor: pointer;
        border: 4px solid var(--ink);
        background: linear-gradient(180deg, #ff7cbb, var(--pink) 60%, var(--pink-dark));
        box-shadow: 0 6px 0 var(--ink), 0 10px 20px rgba(0, 0, 0, 0.35);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .btn.secondary { background: linear-gradient(180deg, #8db6ff, var(--blue) 60%, var(--blue-dark)); }
      .btn.ghost { background: rgba(255, 255, 255, 0.08); box-shadow: 0 4px 0 var(--ink); font-size: 18px; padding: 10px 20px; }
      .btn:hover { transform: translateY(-2px) scale(1.03); }
      .btn:active { transform: translateY(5px) scale(0.97, 0.94); box-shadow: 0 1px 0 var(--ink), 0 4px 8px rgba(0, 0, 0, 0.3); }
      .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

      /* ---------- Seleção de personagem ---------- */
      .title {
        margin: 0; font-weight: 700; font-size: clamp(30px, 7vw, 54px); color: var(--yellow);
        -webkit-text-stroke: 0.07em var(--ink); paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink);
      }
      .characters { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
      .char-card {
        position: relative; width: min(260px, 72vw); padding: 14px 14px 0; box-sizing: border-box;
        border: 5px solid var(--ink); border-radius: 28px; cursor: pointer;
        background: radial-gradient(circle at 50% 30%, #ffe7f3, #ffb3d6 55%, var(--pink) 100%);
        box-shadow: 0 8px 0 var(--ink), 0 14px 30px rgba(0, 0, 0, 0.4);
        display: flex; flex-direction: column; align-items: center; overflow: hidden;
        font: inherit; color: inherit; transition: transform 0.15s ease;
      }
      .char-card:hover { transform: translateY(-3px) rotate(-1deg); }
      .char-card.selected { outline: 5px solid var(--yellow); outline-offset: 4px; }
      .char-card img { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.25)); }
      .char-name {
        position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
        font-weight: 700; font-size: 42px; color: #fff;
        -webkit-text-stroke: 0.08em var(--ink); paint-order: stroke fill;
        text-shadow: 0 0.08em 0 var(--ink);
      }
      .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      .row .btn { min-width: 140px; }

      /* ---------- HUD do jogo ---------- */
      #hud { position: fixed; top: 12px; left: 12px; z-index: 15; display: none; gap: 10px; align-items: center; }
      body.playing #hud { display: flex; }
      #hud .btn { font-size: 16px; padding: 8px 16px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
      body.playing #hud .btn { cursor: pointer; }
      #hud .tag {
        font-weight: 700; color: #fff; font-size: 18px;
        -webkit-text-stroke: 0.08em var(--ink); paint-order: stroke fill;
      }
      .hint {
        position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 15;
        color: rgba(255, 255, 255, 0.75); font-size: 15px; text-align: center; pointer-events: none;
        display: none; padding: 0 16px; width: max-content; max-width: calc(100% - 32px);
      }
      body.playing .hint { display: block; animation: fade-out 1s ease 5s forwards; }
      @keyframes fade-out { to { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .logo, .logo span, .o-ball { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Tela inicial -->
    <section id="screen-title" class="screen active" aria-label="Menu inicial">
      <h1 class="logo" aria-label="Mamá's Squishy World">
        <span class="line l1" aria-hidden="true"><span>M</span><span>a</span><span>m</span><span>á</span><span>'</span><span>s</span></span>
        <span class="line l2" aria-hidden="true">Squishy W<span class="o-ball"></span>rld</span>
      </h1>
      <nav class="menu">
        <button class="btn" data-action="play">Play game</button>
        <button class="btn secondary" data-action="choose">Choose character</button>
      </nav>
    </section>

    <!-- Seleção de personagem -->
    <section id="screen-select" class="screen" aria-label="Escolha de personagem">
      <h2 class="title">Choose character</h2>
      <div class="characters">
        <button class="char-card selected" data-character="mama" aria-pressed="true">
          <img alt="Mamá com os braços erguidos e as mãos se tocando" />
          <span class="char-name">Mamá</span>
        </button>
      </div>
      <div class="row">
        <button class="btn ghost" data-action="back">Back</button>
        <button class="btn" data-action="start">Play</button>
      </div>
    </section>

    <!-- HUD durante o jogo -->
    <div id="hud">
      <button class="btn secondary" data-action="menu">Menu</button>
      <span class="tag" id="hud-name">Mamá</span>
    </div>
    <div class="hint" id="hint"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
